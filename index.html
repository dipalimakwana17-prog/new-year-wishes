<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2027 ❤️</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
text-align:center;
color:white;
min-height:100vh;
background:linear-gradient(135deg,#16002c,#4b006e,#c2185b);
overflow-x:hidden;
}
.container{padding:60px 20px}
h1{
font-size:40px;
color:#ffdf80;
text-shadow:0 0 20px pink;
}
.heart{font-size:55px;animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.3)}}
input{
padding:15px;
width:85%;
max-width:320px;
border:none;
border-radius:25px;
font-size:17px;
text-align:center;
margin:20px 0;
}
button{
padding:14px 25px;
border:none;
border-radius:25px;
background:#ffcf50;
color:#5a004e;
font-size:17px;
font-weight:bold;
cursor:pointer;
}
#wish{
display:none;
margin-top:30px;
font-size:21px;
line-height:1.8;
}
.card{
background:#ffffff20;
padding:25px;
border-radius:25px;
max-width:450px;
margin:auto;
box-shadow:0 0 25px #ff91d5;
}
footer{margin-top:45px;color:#ffd6eb}
.star{
position:fixed;
top:-20px;
animation:fall linear infinite;
pointer-events:none;
}
@keyframes fall{
to{transform:translateY(110vh) rotate(360deg)}
}
</style>
</head>

<body>

<div class="container">
<div class="heart">❤️</div>

<h1>Happy New Year 2027 🎆</h1>
<h3>A New Year, A New Beginning ✨</h3>

<div class="card">

<div id="form">
<p>Enter Your Beautiful Name 💗</p>
<input id="name" placeholder="Enter your name...">
<br>
<button onclick="showWish()">Open Your Surprise 🎁</button>
</div>

<div id="wish">
<h2 id="title"></h2>
<p>
May this New Year bring you endless happiness,
love, success and beautiful memories. 💖
</p>
<p>
May all your dreams come true! ✨
</p>
<h2>Stay Happy Always! 🥰</h2>
🎉 Happy New Year 2027 🎉
<br><br>
<button onclick="shareWish()">Share Wishes 💌</button>
</div>

</div>

<footer>
Made With ❤️ For Someone Special
</footer>
</div>

<script>
function showWish(){
let n=document.getElementById("name").value.trim();

if(!n){
alert("Please enter your name ❤️");
return;
}

document.getElementById("form").style.display="none";
document.getElementById("wish").style.display="block";
document.getElementById("title").innerText="Dear "+n+" ❤️";

history.replaceState(null,"","?to="+encodeURIComponent(n));
}

function shareWish(){
let link=window.location.href;
if(navigator.share){
navigator.share({
title:"Happy New Year 2027",
text:"I have a special New Year surprise for you! ❤️",
url:link
});
}else{
navigator.clipboard.writeText(link);
alert("Link copied! Share it with your friends ❤️");
}
}

let person=new URLSearchParams(location.search).get("to");
if(person){
document.getElementById("name").value=person;
showWish();
}

for(let i=0;i<35;i++){
let s=document.createElement("div");
s.className="star";
s.innerHTML=["✨","💖","⭐","🎉"][Math.floor(Math.random()*4)];
s.style.left=Math.random()*100+"vw";
s.style.animationDuration=(3+Math.random()*5)+"s";
s.style.fontSize=(15+Math.random()*20)+"px";
document.body.appendChild(s);
}
</script>

</body>
</html>
